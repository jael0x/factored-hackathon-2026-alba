name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (lint, types, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alba
          POSTGRES_PASSWORD: alba
          POSTGRES_DB: alba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alba -d alba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ALBA_TEST_ADMIN_DATABASE_URL: postgresql://alba:alba@localhost:5432/postgres
      ALBA_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt
            pipeline/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint, types, tests, coverage floors
        run: sh scripts/check.sh
      - name: Every changed line is covered
        if: github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=100 \
            --format markdown:diff-cover.md
      - name: Coverage summary
        if: always() && github.event_name == 'pull_request'
        run: test -f diff-cover.md && cat diff-cover.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            diff-cover.md
          if-no-files-found: ignore

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  contract:
    name: Generated contract matches openapi.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api-spec/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci --prefix api-spec
      - run: python api-spec/generate.py
      - name: No hand edits or stale output
        run: git diff --exit-code -- api/contract_models.py web/src/api/schema.d.ts

  hygiene:
    name: No data, PDFs, or secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Forbidden paths are not tracked
        run: |
          forbidden=$(git ls-files | grep -E '^data/|\.pdf$|(^|/)\.env(\..*)?$' | grep -v '^\.env\.example$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::These files must never be committed:"
            echo "$forbidden"
            exit 1
          fi
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Secret scan of the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || format('{0}..{1}', github.event.before, github.sha) }}
        run: ./gitleaks git . --no-banner --redact --log-opts="$RANGE"
