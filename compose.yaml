services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alba
      POSTGRES_PASSWORD: alba
      POSTGRES_DB: alba
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alba -d alba"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "55432:5432"

  load:
    build:
      context: .
      dockerfile: docker/load.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://alba:alba@postgres:5432/alba
      RAW_DIR: /data/raw
      MIGRATIONS_DIR: /app/db/migrations
    volumes:
      - ./data/raw:/data/raw
      - ./db/migrations:/app/db/migrations:ro
      - ./pipeline:/app/pipeline:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://alba:alba@postgres:5432/alba
      DEMO_INBOX: "1"
      LLM_MODEL: gpt-6-luna
    ports:
      - "8000:8000"
    depends_on:
      load:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  test:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    environment:
      ALBA_TEST_ADMIN_DATABASE_URL: postgresql://alba:alba@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - test

volumes:
  pgdata:
