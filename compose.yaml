services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alba
      POSTGRES_PASSWORD: alba
      POSTGRES_DB: alba
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alba -d alba"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "55432:5432"

  load:
    build:
      context: .
      dockerfile: docker/load.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://alba:alba@postgres:5432/alba
      RAW_DIR: /data/raw
      MIGRATIONS_DIR: /app/db/migrations
    volumes:
      - ./data/raw:/data/raw
      - ./db/migrations:/app/db/migrations:ro
      - ./pipeline:/app/pipeline:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://alba:alba@postgres:5432/alba
      DEMO_LOGIN: "1"
      RUN_WORKER: "1"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: "Alba <no-reply@alba.local>"
      LLM_MODEL: ${LLM_MODEL:-b0-keywords}  # PLAN.md D23: the keyword baseline until an OPENAI_API_KEY exists
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/api"]
    depends_on:
      load:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.30.2
    ports:
      - "8025:8025"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
      MAILPIT_PROXY_TARGET: http://mailpit:8025
      VITE_USE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - api

  test:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    pull_policy: build
    environment:
      ALBA_TEST_ADMIN_DATABASE_URL: postgresql://alba:alba@postgres:5432/postgres
      ALBA_REQUIRE_POSTGRES: "1"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - test

volumes:
  pgdata:
