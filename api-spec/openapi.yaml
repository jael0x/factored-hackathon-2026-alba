openapi: 3.0.3
info:
  title: Alba API
  version: "1.0.0"
  description: >
    Wire contract for the Alba credit pre-qualification demo.
    ARCHITECTURE.md decides behavior. This file decides the JSON.
    api/contract_models.py and web/src/api/schema.d.ts are generated from this file.
    Do not hand-write a second request or response type.

servers:
  - url: http://localhost:8000
    description: API process. The web app calls the same paths under the /api proxy, which strips that prefix.

tags:
  - name: Ops
  - name: Session
  - name: Customer
  - name: Consultant

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Ops]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The API process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /ready:
    get:
      tags: [Ops]
      operationId: getReady
      security: []
      responses:
        "200":
          description: Postgres answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyOk"
        "503":
          description: Postgres did not answer. error is the exception class name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyDown"

  /config:
    get:
      tags: [Ops]
      operationId: getConfig
      security: []
      summary: Whether the demo login helpers are on.
      description: >
        demo_login is true when the API runs with DEMO_LOGIN=1. The login screen shows the
        customer search and the random pick only then.
      responses:
        "200":
          description: Client configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"

  /customers/search:
    get:
      tags: [Session]
      operationId: searchCustomers
      security: []
      summary: Demo helper. Search the loaded customers, or pick one with an email at random.
      description: >
        Only with DEMO_LOGIN=1; not found otherwise. It fills the login form and never opens a session.
        Send q or random=true, not both and not neither.
        With q, at most 20 rows matching name, document number, or customer_id,
        ordered by last_name, first_name, customer_id ascending.
        With random=true, one customer with an email on file.
        Any customer in gold can be found. The four oracle profiles are not an allowlist.
      parameters:
        - $ref: "#/components/parameters/OptionalSearchQuery"
        - $ref: "#/components/parameters/RandomPick"
      responses:
        "200":
          description: Matching customers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSearchResults"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"

  /session/code:
    post:
      tags: [Session]
      operationId: requestCustomerCode
      security: []
      summary: Email a 6-digit code to the customer with this document number.
      description: >
        When document_number matches a customer with an email on file, a code valid for 10 minutes
        is stored as a hash and emailed to that address. A new request replaces any unused code
        for the same customer. The response is the same whether or not the document matches and
        whether or not the customer has an email. It never carries the code, the address, or the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCustomerCode"
      responses:
        "200":
          description: The request was taken. A code was sent only if the document matched a customer with an email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRequested"
        "422":
          $ref: "#/components/responses/InvalidRequest"

  /session:
    post:
      tags: [Session]
      operationId: openCustomerSession
      security: []
      summary: Exchange a document number and its emailed code for a JWT.
      description: >
        Claims inside the token are sub = customer_id, role = customer, exp 15 minutes.
        The body repeats sub and role so the client can route without decoding the token.
        The code must be the latest unused one for the customer with this document number,
        under 10 minutes old, with fewer than 5 wrong tries. The fifth wrong code spends it.
        A used code does not open a second session. Every failure is the same unauthorized answer.
        An expired token on a later call is 401. The session is not renewed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenCustomerSessionRequest"
      responses:
        "200":
          description: Customer session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"

  /consultants/search:
    get:
      tags: [Session]
      operationId: searchConsultants
      security: []
      summary: Demo helper. Search the active consultants, or pick one at random.
      description: >
        Only with DEMO_LOGIN=1; not found otherwise. It fills the consultant login form and never opens a session.
        Send q or random=true, not both and not neither.
        Only consultants whose service_agents.agent_status is Active are listed, because only they can receive a code.
        With q, at most 20 rows matching name, employee code, or consultant_id,
        ordered by last_name, first_name, consultant_id ascending.
        With random=true, one active consultant.
      parameters:
        - $ref: "#/components/parameters/OptionalSearchQuery"
        - $ref: "#/components/parameters/RandomPick"
      responses:
        "200":
          description: Matching active consultants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantSearchResults"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"

  /consultant/session/code:
    post:
      tags: [Session]
      operationId: requestConsultantCode
      security: []
      summary: Email a 6-digit code to the active consultant with this email and employee code.
      description: >
        Spaces around either field are ignored, the email is compared in lower case, and the employee code
        in upper case. When the pair matches a consultant whose service_agents.agent_status is Active, a code valid for
        10 minutes is stored as a hash and emailed to that address. A new request replaces any unused code
        for the same consultant. The response is the same for every pair and every status.
        It never carries the code, the address, or the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestConsultantCode"
      responses:
        "200":
          description: The request was taken. A code was sent only if the pair matched an active consultant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRequested"
        "422":
          $ref: "#/components/responses/InvalidRequest"

  /consultant/session:
    post:
      tags: [Session]
      operationId: openConsultantSession
      security: []
      summary: Exchange an email, an employee code, and the emailed code for a JWT.
      description: >
        Claims inside the token are sub = consultant_id, role = consultant, exp 15 minutes.
        The pair is matched as on the code request and must still belong to an active consultant.
        The code must be the latest unused one for that consultant, under 10 minutes old, with fewer than
        5 wrong tries. The fifth wrong code spends it. A used code does not open a second session.
        A customer code does not open a consultant session. Every failure is the same unauthorized answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenConsultantSessionRequest"
      responses:
        "200":
          description: Consultant session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"

  /me:
    get:
      tags: [Customer]
      operationId: getCurrentCustomer
      summary: The session customer's id and name.
      description: >
        Requires role customer. customer_id is the token sub. The app bar and the home greeting
        read the name from here; the login responses never carry it.
      responses:
        "200":
          description: The customer on the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCustomer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /products:
    get:
      tags: [Customer]
      operationId: listProducts
      summary: Products of the customer in the JWT, in the currency stored on the row.
      description: >
        Requires role customer. A consultant token is forbidden.
        customer_id is optional. If it is absent, or equal to the token sub, the response is that customer's products.
        If it is any other id, the response is an empty list. Balances are not converted.
        Order is product_id ascending.
        days_past_due, credit_limit, and interest_rate are not on this response.
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The session customer's products, or an empty list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /messages:
    post:
      tags: [Customer]
      operationId: sendMessage
      summary: Append the customer's message and return the case after that cycle's commands finish.
      description: >
        Requires role customer. The body is text and client_message_id.
        The customer does not send process_id or process_state. customer_id comes from the token.
        The handler appends conversation.message_received. It does not choose an outcome.
        The response is sent after the worker has finished the commands enqueued from that event.
        The same client_message_id returns this case again and does not append a second event.
        The first message of a new case still has a null process_id on the event.
        The returned case uses the process that cycle opened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: The case this message belongs to, after the worker finishes that cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidRequest"

  /case/{process_id}:
    get:
      tags: [Customer]
      operationId: getCase
      summary: The customer's thread and certificate for one process.
      description: >
        Requires role customer. The process must belong to the token sub.
        Another customer's process, or an unknown id, is not found.
      parameters:
        - $ref: "#/components/parameters/ProcessId"
      responses:
        "200":
          description: Thread and certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /consultant/me:
    get:
      tags: [Consultant]
      operationId: getCurrentConsultant
      summary: The session consultant's id, employee code, name, and specialty.
      description: >
        Requires role consultant. consultant_id is the token sub. specialty is null when the file has none.
        The consultant screens read the name from here; the login responses never carry it.
      responses:
        "200":
          description: The consultant on the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentConsultant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /consultant/queue:
    get:
      tags: [Consultant]
      operationId: listConsultantQueue
      summary: Processes in human_active.
      description: >
        Requires role consultant. Ended and ai_active processes are not listed.
        Order is processes.created_at ascending, then process id ascending.
      responses:
        "200":
          description: The review queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /consultant/case/{process_id}:
    get:
      tags: [Consultant]
      operationId: getConsultantCase
      summary: Handoff packet for a process in human_active.
      description: >
        Requires role consultant. A process that is not human_active is not found.
        Packet fields that come from analysis.completed are null when that event does not exist
        (a handoff before the policy ran). There is no text field and no reply body.
      parameters:
        - $ref: "#/components/parameters/ProcessId"
      responses:
        "200":
          description: The packet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantCase"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /consultant/case/{process_id}/trace:
    get:
      tags: [Consultant]
      operationId: getConsultantCaseTrace
      summary: The process events, in the order they were recorded.
      description: >
        Requires role consultant.
        Included events are those whose process_id is this process, plus the single event
        referenced by process.started.caused_by_event_id when that opening message has a null process_id.
        If that caused_by_event_id is null, the opening message is not attached by time.
        Order is created_at ascending, then event id ascending.
      parameters:
        - $ref: "#/components/parameters/ProcessId"
      responses:
        "200":
          description: Events for this process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseTrace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /consultant/case/{process_id}/close:
    post:
      tags: [Consultant]
      operationId: closeConsultantCase
      summary: Close a human_active case as pre-qualified or not.
      description: >
        Requires role consultant. outcome is PREQUALIFIED or NOT_PREQUALIFIED.
        Any other outcome, or a text field, is invalid_body. There is no reply.
        The handler appends conversation.consultant_closed. It does not run the policy.
        A second close of the same process is already_closed and does not append another event.
        A process that is not human_active is not found, except a process already ended, which is already_closed.
      parameters:
        - $ref: "#/components/parameters/ProcessId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseCaseRequest"
      responses:
        "200":
          description: The case is ended with that outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultantCloseResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlreadyClosed"
        "422":
          $ref: "#/components/responses/InvalidRequest"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OptionalSearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    RandomPick:
      name: random
      in: query
      required: false
      schema:
        type: boolean
        enum: [true]
    ProcessId:
      name: process_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing token, expired token, or a code that does not open a session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
    Forbidden:
      description: The token role cannot call this route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"
    NotFound:
      description: No row for this id under the token's scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    AlreadyClosed:
      description: This process was already ended. The outcome does not change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AlreadyClosedError"
    InvalidRequest:
      description: The body or query does not match the schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidRequestError"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadyOk:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]

    ReadyDown:
      type: object
      additionalProperties: false
      required: [status, error]
      properties:
        status:
          type: string
          enum: [not_ready]
        error:
          type: string
          minLength: 1
          description: Exception class name. Not a customer-facing sentence.

    UnauthorizedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [unauthorized]

    ForbiddenError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [forbidden]

    NotFoundError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [not_found]

    AlreadyClosedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [already_closed]

    InvalidRequestError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_body]

    Role:
      type: string
      enum: [customer, consultant]

    ProcessState:
      type: string
      enum: [ai_active, human_active, ended]

    EndReason:
      type: string
      enum: [prequalified, not_prequalified]

    ProductKey:
      type: string
      enum: [credit_card, personal_loan]

    TemplateLocale:
      type: string
      enum: [es, pt]

    TurnLanguage:
      type: string
      enum: [es, pt, other]

    Outcome:
      type: string
      enum: [PREQUALIFIED, NOT_PREQUALIFIED, REFER, NEEDS_INFO]

    CloseOutcome:
      type: string
      enum: [PREQUALIFIED, NOT_PREQUALIFIED]

    IncomeCurrency:
      type: string
      enum: [MXN, COP, ARS]

    ReasonCode:
      type: string
      enum:
        - customer_requested_human
        - out_of_scope
        - language_unsupported
        - model_output_invalid
        - tool_failed
        - policy_refer
        - reply_forbidden

    Intent:
      type: string
      enum:
        - product_info
        - prequalify_card
        - prequalify_loan
        - confirm_prequalify
        - decline_prequalify
        - provide_income
        - human_request
        - out_of_scope
        - clarify
        - chit_chat

    TemplateId:
      type: string
      enum: [needs_income, refer_notice, which_product, confirm_prequalify]

    DecidedBy:
      type: string
      enum: [policy, consultant]

    RuleId:
      type: string
      enum: [R01, R02, R03, R04, R05, R06, R09]

    Actor:
      type: string
      enum: [customer, consultant, system, rule]

    MessageAuthor:
      type: string
      enum: [customer, assistant, template]

    PolicyVersion:
      type: string
      enum: [alba-credit-v1]

    ProcessKey:
      type: string
      enum: [credit_prequalification]

    Config:
      type: object
      additionalProperties: false
      required: [demo_login]
      properties:
        demo_login:
          type: boolean

    CustomerSearchHit:
      type: object
      additionalProperties: false
      required: [customer_id, document_number, first_name, last_name, country]
      properties:
        customer_id:
          type: string
        document_number:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        country:
          type: string

    CustomerSearchResults:
      type: object
      additionalProperties: false
      required: [customers]
      properties:
        customers:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/CustomerSearchHit"

    ConsultantSearchHit:
      type: object
      additionalProperties: false
      required: [consultant_id, employee_code, first_name, last_name, email]
      properties:
        consultant_id:
          type: string
        employee_code:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string

    ConsultantSearchResults:
      type: object
      additionalProperties: false
      required: [consultants]
      properties:
        consultants:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConsultantSearchHit"

    RequestCustomerCode:
      type: object
      additionalProperties: false
      required: [document_number]
      properties:
        document_number:
          type: string
          minLength: 1

    CodeRequested:
      type: object
      additionalProperties: false
      required: [expires_in_seconds]
      properties:
        expires_in_seconds:
          type: integer
          enum: [600]
          description: How long a sent code is valid. The same value whether or not a code was sent.

    OpenCustomerSessionRequest:
      type: object
      additionalProperties: false
      required: [document_number, code]
      properties:
        document_number:
          type: string
          minLength: 1
        code:
          type: string
          pattern: "^[0-9]{6}$"

    RequestConsultantCode:
      type: object
      additionalProperties: false
      required: [email, employee_code]
      properties:
        email:
          type: string
          minLength: 1
        employee_code:
          type: string
          minLength: 1

    OpenConsultantSessionRequest:
      type: object
      additionalProperties: false
      required: [email, employee_code, code]
      properties:
        email:
          type: string
          minLength: 1
        employee_code:
          type: string
          minLength: 1
        code:
          type: string
          pattern: "^[0-9]{6}$"

    Session:
      type: object
      additionalProperties: false
      required: [token, sub, role]
      properties:
        token:
          type: string
        sub:
          type: string
          description: customer_id or consultant_id, the same value as the token sub claim.
        role:
          $ref: "#/components/schemas/Role"

    CurrentCustomer:
      type: object
      additionalProperties: false
      required: [customer_id, first_name, last_name]
      properties:
        customer_id:
          type: string
        first_name:
          type: string
        last_name:
          type: string

    CurrentConsultant:
      type: object
      additionalProperties: false
      required: [consultant_id, employee_code, first_name, last_name, specialty]
      properties:
        consultant_id:
          type: string
        employee_code:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        specialty:
          type: string
          nullable: true

    Product:
      type: object
      additionalProperties: false
      required: [product_id, product_type, product_number, currency, current_balance, product_status]
      properties:
        product_id:
          type: string
        product_type:
          type: string
          description: Dataset literal as stored, for example Tarjeta Crédito. Not translated.
        product_number:
          type: string
        currency:
          type: string
          description: The products.currency value. Not converted.
        current_balance:
          type: number
        product_status:
          type: string

    ProductList:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [text, client_message_id]
      properties:
        text:
          type: string
          minLength: 1
        client_message_id:
          type: string
          format: uuid
          description: One id per send. The idempotency key is msg:{client_message_id}.

    ThreadMessage:
      type: object
      additionalProperties: false
      required: [id, author, body, event_id]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/MessageAuthor"
        body:
          type: string
        event_id:
          type: string
          format: uuid

    Certificate:
      type: object
      additionalProperties: false
      description: >
        Present only when prequalification.decided exists for this process.
        Income fields are copied from facts on the analysis.completed for this process
        (names income_local, income_currency, income_usd). as_of is the as_of of the income_local fact.
        A missing fact is null. This object has no credit limit and no interest rate.
      required: [locale, outcome, body, product, income_local, income_currency, income_usd, as_of]
      properties:
        locale:
          $ref: "#/components/schemas/TemplateLocale"
        outcome:
          $ref: "#/components/schemas/CloseOutcome"
        body:
          type: string
        product:
          allOf:
            - $ref: "#/components/schemas/ProductKey"
          nullable: true
        income_local:
          type: number
          nullable: true
        income_currency:
          allOf:
            - $ref: "#/components/schemas/IncomeCurrency"
          nullable: true
        income_usd:
          type: number
          nullable: true
        as_of:
          type: string
          format: date
          nullable: true

    Case:
      type: object
      additionalProperties: false
      description: >
        messages is the thread. Customer lines come from conversation.message_received events
        that belong to the process, including the opening message reached by
        process.started.caused_by_event_id. Assistant and template lines come from messages rows.
        A messages row with a null event_id is omitted. Order is the linked event's created_at
        ascending, then event id ascending. certificate is null until prequalification.decided exists.
      required: [process_id, state, end_reason, product, language, messages, certificate]
      properties:
        process_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/ProcessState"
        end_reason:
          allOf:
            - $ref: "#/components/schemas/EndReason"
          nullable: true
        product:
          allOf:
            - $ref: "#/components/schemas/ProductKey"
          nullable: true
        language:
          allOf:
            - $ref: "#/components/schemas/TemplateLocale"
          nullable: true
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ThreadMessage"
        certificate:
          allOf:
            - $ref: "#/components/schemas/Certificate"
          nullable: true

    ConsultantQueueItem:
      type: object
      additionalProperties: false
      required: [process_id, customer_id, first_name, last_name, product, reason_code, language]
      properties:
        process_id:
          type: string
          format: uuid
        customer_id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        product:
          allOf:
            - $ref: "#/components/schemas/ProductKey"
          nullable: true
        reason_code:
          $ref: "#/components/schemas/ReasonCode"
        language:
          allOf:
            - $ref: "#/components/schemas/TemplateLocale"
          nullable: true

    ConsultantQueue:
      type: object
      additionalProperties: false
      required: [cases]
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/ConsultantQueueItem"

    ConsultantCase:
      type: object
      additionalProperties: false
      description: >
        The handoff packet. product, credit_score, the income fields, deciding_rule,
        policy_version, and outcome are copied from analysis.completed. They are null
        when that event does not exist. reason_code is copied from conversation.thread_taken.
      required:
        - process_id
        - state
        - customer_id
        - first_name
        - last_name
        - product
        - credit_score
        - income_local
        - income_currency
        - income_usd
        - deciding_rule
        - policy_version
        - outcome
        - reason_code
        - language
      properties:
        process_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [human_active]
        customer_id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        product:
          allOf:
            - $ref: "#/components/schemas/ProductKey"
          nullable: true
        credit_score:
          type: number
          nullable: true
        income_local:
          type: number
          nullable: true
        income_currency:
          allOf:
            - $ref: "#/components/schemas/IncomeCurrency"
          nullable: true
        income_usd:
          type: number
          nullable: true
        deciding_rule:
          allOf:
            - $ref: "#/components/schemas/RuleId"
          nullable: true
        policy_version:
          allOf:
            - $ref: "#/components/schemas/PolicyVersion"
          nullable: true
        outcome:
          allOf:
            - $ref: "#/components/schemas/Outcome"
          nullable: true
        reason_code:
          $ref: "#/components/schemas/ReasonCode"
        language:
          allOf:
            - $ref: "#/components/schemas/TemplateLocale"
          nullable: true

    CloseCaseRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          $ref: "#/components/schemas/CloseOutcome"

    ConsultantCloseResult:
      type: object
      additionalProperties: false
      required: [process_id, state, end_reason, outcome]
      properties:
        process_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [ended]
        end_reason:
          $ref: "#/components/schemas/EndReason"
        outcome:
          $ref: "#/components/schemas/CloseOutcome"

    Fact:
      type: object
      additionalProperties: false
      required: [name, value, source, as_of]
      properties:
        name:
          type: string
        value:
          nullable: true
          oneOf:
            - type: string
            - type: number
            - type: boolean
        source:
          type: string
        as_of:
          type: string
          format: date

    RuleTraceStep:
      type: object
      additionalProperties: false
      required: [rule_id, input, result]
      properties:
        rule_id:
          $ref: "#/components/schemas/RuleId"
        input:
          type: object
          additionalProperties: true
          description: Condition snapshot recorded with the step. The trace displays it. No rule matches on it.
        result:
          type: string

    TraceEventBase:
      type: object
      additionalProperties: false
      required: [id, created_at, actor, process_id, process_state, caused_by_event_id]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Actor"
        process_id:
          type: string
          format: uuid
          nullable: true
        process_state:
          $ref: "#/components/schemas/ProcessState"
        caused_by_event_id:
          type: string
          format: uuid
          nullable: true

    TraceMessageReceived:
      allOf:
        - $ref: "#/components/schemas/TraceEventBase"
        - type: object
          additionalProperties: false
          required: [event_name, text, client_message_id]
          properties:
            event_name:
              type: string
              enum: [conversation.message_received]
            text:
              type: string
            client_message_id:
              type: string
              format: uuid

    TraceTurnClassified:
      allOf:
        - $ref: "#/components/schemas/TraceEventBase"
        - type: object
          additionalProperties: false
          required:
            - event_name
            - intent
            - product
            - language
            - declared_income_amount
            - declared_income_currency
            - reply_text
            - reply_ok
            - reason_code
          properties:
            event_name:
              type: string
              enum: [conversation.turn_classified]
            intent:
              $ref: "#/components/schemas/Intent"
            product:
              allOf:
                - $ref: "#/components/schemas/ProductKey"
              nullable: true
            language:
              $ref: "#/components/schemas/TurnLanguage"
            declared_income_amount:
              type: number
              nullable: true
            declared_income_currency:
              allOf:
                - $ref: "#/components/schemas/IncomeCurrency"
              nullable: true
            reply_text:
              type: string
            reply_ok:
              type: boolean
            reason_code:
              allOf:
                - $ref: "#/components/schemas/ReasonCode"
              nullable: true

    TraceTemplateSent:
      allOf:
        - $ref: "#/components/schemas/TraceEventBase"
        - type: object
          additionalProperties: false
          required: [event_name, locale, template_id, body]
          properties:
            event_name:
              type: string
              enum: [conversation.template_sent]
            locale:
              $ref: "#/components/schemas/TemplateLocale"
            template_id:
              $ref: "#/components/schemas/TemplateId"
            body:
              type: string

    TraceConsultantClosed:
      allOf:
        - $ref: "#/components/schemas/TraceEventBase"
        - type: object
          additionalProperties: false
          required: [event_name, outcome, consultant_id, language]
          properties:
            event_name:
              type: string
              enum: [conversation.consultant_closed]
            outcome:
              $ref: "#/components/schemas/CloseOutcome"
            consultant_id:
              type: string
            language:
              allOf:
                - $ref: "#/components/schemas/TemplateLocale"
              nullable: true

    TraceThreadTaken:
      allOf:
        - $ref: "#/components/schemas/TraceEventBase"
        - type: object
          additionalProperties: false
          required: [event_name, reason_code, from_state, to_state]
          properties:
            event_name:
              type: string
              enum: [conversation.thread_taken]
            reason_code:
              $ref: "#/components/schemas/ReasonCode"
            from_state:
              $ref: "#/components/schemas/ProcessState"
            to_state:
              $ref: "#/components/schemas/ProcessState"

    TraceAnalysisCompleted:
      allOf:
        - $ref: "#/components/schemas/TraceEventBase"
        - type: object
          additionalProperties: false
          required:
            - event_name
            - policy_version
            - product
            - outcome
            - deciding_rule
            - rule_trace
            - facts
            - language
          properties:
            event_name:
              type: string
              enum: [analysis.completed]
            policy_version:
              $ref: "#/components/schemas/PolicyVersion"
            product:
              $ref: "#/components/schemas/ProductKey"
            outcome:
              $ref: "#/components/schemas/Outcome"
            deciding_rule:
              $ref: "#/components/schemas/RuleId"
            rule_trace:
              type: array
              items:
                $ref: "#/components/schemas/RuleTraceStep"
            facts:
              type: array
              items:
                $ref: "#/components/schemas/Fact"
            language:
              $ref: "#/components/schemas/TemplateLocale"

    TracePrequalificationDecided:
      allOf:
        - $ref: "#/components/schemas/TraceEventBase"
        - type: object
          additionalProperties: false
          required: [event_name, locale, outcome, body, decided_by]
          properties:
            event_name:
              type: string
              enum: [prequalification.decided]
            locale:
              $ref: "#/components/schemas/TemplateLocale"
            outcome:
              $ref: "#/components/schemas/CloseOutcome"
            body:
              type: string
            decided_by:
              $ref: "#/components/schemas/DecidedBy"

    TraceProcessStarted:
      allOf:
        - $ref: "#/components/schemas/TraceEventBase"
        - type: object
          additionalProperties: false
          required: [event_name, process_key, customer_id]
          properties:
            event_name:
              type: string
              enum: [process.started]
            process_key:
              $ref: "#/components/schemas/ProcessKey"
            customer_id:
              type: string

    TraceProcessStateChanged:
      allOf:
        - $ref: "#/components/schemas/TraceEventBase"
        - type: object
          additionalProperties: false
          required: [event_name, from_state, to_state, end_reason]
          properties:
            event_name:
              type: string
              enum: [process.state_changed]
            from_state:
              $ref: "#/components/schemas/ProcessState"
            to_state:
              $ref: "#/components/schemas/ProcessState"
            end_reason:
              allOf:
                - $ref: "#/components/schemas/EndReason"
              nullable: true

    TraceProcessEnded:
      allOf:
        - $ref: "#/components/schemas/TraceEventBase"
        - type: object
          additionalProperties: false
          required: [event_name, end_reason, policy_version]
          properties:
            event_name:
              type: string
              enum: [process.ended]
            end_reason:
              $ref: "#/components/schemas/EndReason"
            policy_version:
              allOf:
                - $ref: "#/components/schemas/PolicyVersion"
              nullable: true

    TraceEvent:
      oneOf:
        - $ref: "#/components/schemas/TraceMessageReceived"
        - $ref: "#/components/schemas/TraceTurnClassified"
        - $ref: "#/components/schemas/TraceTemplateSent"
        - $ref: "#/components/schemas/TraceConsultantClosed"
        - $ref: "#/components/schemas/TraceThreadTaken"
        - $ref: "#/components/schemas/TraceAnalysisCompleted"
        - $ref: "#/components/schemas/TracePrequalificationDecided"
        - $ref: "#/components/schemas/TraceProcessStarted"
        - $ref: "#/components/schemas/TraceProcessStateChanged"
        - $ref: "#/components/schemas/TraceProcessEnded"
      discriminator:
        propertyName: event_name
        mapping:
          conversation.message_received: "#/components/schemas/TraceMessageReceived"
          conversation.turn_classified: "#/components/schemas/TraceTurnClassified"
          conversation.template_sent: "#/components/schemas/TraceTemplateSent"
          conversation.consultant_closed: "#/components/schemas/TraceConsultantClosed"
          conversation.thread_taken: "#/components/schemas/TraceThreadTaken"
          analysis.completed: "#/components/schemas/TraceAnalysisCompleted"
          prequalification.decided: "#/components/schemas/TracePrequalificationDecided"
          process.started: "#/components/schemas/TraceProcessStarted"
          process.state_changed: "#/components/schemas/TraceProcessStateChanged"
          process.ended: "#/components/schemas/TraceProcessEnded"

    CaseTrace:
      type: object
      additionalProperties: false
      required: [process_id, events]
      properties:
        process_id:
          type: string
          format: uuid
        events:
          type: array
          items:
            $ref: "#/components/schemas/TraceEvent"
