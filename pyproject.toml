[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["api/contract_models.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF"]
# The formatter owns line length. UP047 asks for PEP 695 syntax, which breaks host runs on Python 3.11.
ignore = ["E501", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "pipeline", "conftest.py"]
exclude = ['^api/contract_models\.py$']
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "api.contract_models"
follow_imports = "silent"

[tool.coverage.run]
branch = true
source = ["api", "pipeline"]
omit = ["api/contract_models.py", "*/test_*.py", "*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['if TYPE_CHECKING:', '\.\.\.$']
