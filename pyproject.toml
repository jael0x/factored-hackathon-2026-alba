[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["api/contract_models.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF"]
# The formatter owns line length.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["api", "pipeline", "eval", "conftest.py"]
exclude = ['^api/contract_models\.py$']
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "api.contract_models"
follow_imports = "silent"

[tool.coverage.run]
branch = true
source = ["api", "pipeline"]
omit = ["api/contract_models.py", "*/test_*.py", "*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# A `case _:` that only calls assert_never is unreachable: mypy proves the match is exhaustive.
exclude_also = ['if TYPE_CHECKING:', '\.\.\.$', 'case _:\n\s*assert_never\(']
